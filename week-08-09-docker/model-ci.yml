name: MLOps Model CI

on:
  push:
  pull_request:

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train and compare models
        run: python train.py

      - name: Run automated model tests
        run: python -m pytest test_model.py -v

      - name: Display model metrics
        run: cat metrics.json
